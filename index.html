<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}html,body{margin:0}</style>
<title>NBA Court Jumbotron</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Big+Shoulders+Text:wght@500;600;700&display=swap">
<style>
/* Layout: the whole screen is an overhead NBA court (94 x 50 ft plus aprons).
   A centre-hung board sits on the top apron, the HOME logo sits at centre court, the away mark at the away free-throw circle,
   stats slide up over the lower half, and the other games run along the bottom.
   --k = screen px per court decifoot (the court is 940 wide), --u = 1/192 of the screen width or 1/108 of its height. */
:root{
  --board:#060912; --plate:rgba(5,8,18,.84); --plate2:rgba(5,8,18,.62); --hair:rgba(255,255,255,.2);
  --white:#f7f9ff; --mute:rgba(247,249,255,.72); --live:#ff2d3d; --gold:#ffc61a; --ball:#e8742a;
  --ca:#1565d8; --ca-hi:#3a85ee; --ca-lo:#0a2f6b; --cb:#e0382a; --cb-hi:#f0604f; --cb-lo:#6b1a12;
  --u:min(calc(100vw / 192), calc(100vh / 108));
  --k:min(calc(100vw / 1060), calc((100vh - 80px) / 660));
  --disp:"Big Shoulders Display","Oswald","Arial Narrow",Impact,sans-serif;
  --text:"Big Shoulders Text","Arial Narrow","Roboto Condensed",sans-serif;
  --slab:36;
  color-scheme:dark;
}
html,body{height:var(--H,100%);margin:0;background:var(--board)}
body{color:var(--white);font:600 calc(var(--u)*2.6)/1.15 var(--text);overflow:hidden;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.idle{cursor:none}
[hidden]{display:none!important}
button,select{font:inherit}

/* ---- backdrop: each team's colour bleeds in from its own side ---- */
.field{position:fixed;top:0;right:0;bottom:0;left:0;z-index:0;overflow:hidden;
  background:radial-gradient(70% 90% at 0% 50%,var(--ca-lo),transparent 70%),radial-gradient(70% 90% at 100% 50%,var(--cb-lo),transparent 70%),var(--board)}

/* ---- stage ---- */
.stage{position:relative;z-index:1;height:100%;box-sizing:border-box;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:calc(var(--u)*.8);padding-block:calc(var(--u)*1)}
.cell{min-height:0;min-width:0;display:flex;align-items:center;justify-content:center}
.wrap{position:relative;width:calc(var(--k)*1060);flex:none}
.arena{position:relative;width:100%;height:calc(var(--k)*660);overflow:hidden;background:var(--board);
  box-shadow:0 0 0 calc(var(--k)*2) rgba(255,255,255,.12),0 calc(var(--k)*14) calc(var(--k)*40) rgba(0,0,0,.6)}
.arena svg.art{position:absolute;top:0;left:0;width:100%;height:100%;display:block}
.arena svg.fxs{z-index:6;pointer-events:none}
.arena svg.floor{z-index:0}
.shake{will-change:transform}

/* the arena reacts to the game */
.arena::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;z-index:9;pointer-events:none;opacity:0;
  box-shadow:inset 0 0 calc(var(--k)*70) calc(var(--k)*8) var(--live)}
.arena.clutch::after{animation:clutch 1.6s ease-in-out infinite}
.arena.foul::after{box-shadow:inset 0 0 calc(var(--k)*80) calc(var(--k)*10) var(--gold);animation:flashy .7s ease-out 2}
.arena.tmo .floor{filter:brightness(.62) saturate(.8)}
.arena .floor{transition:filter .4s ease}
.arena.lose-a #dimA,.arena.lose-h #dimH{opacity:.46}
#dimA,#dimH{opacity:0;transition:opacity .6s ease}

/* ---- overlays on the court ---- */
.ov{position:absolute;z-index:3}
.hub{left:50%;top:54.545%;width:calc(var(--k)*112);height:calc(var(--k)*112);transform:translate(-50%,-50%)}
.fl{top:54.545%;width:calc(var(--k)*84);height:calc(var(--k)*84);transform:translate(-50%,-50%);opacity:.9}
.fl.a{left:23.585%}.fl.h{left:76.415%}
.lgbadge{box-sizing:border-box;width:100%;height:100%;padding:14%;border-radius:50%;background:radial-gradient(circle at 50% 28%,#fff,#e8ecf4);
  box-shadow:0 0 0 calc(var(--k)*3.5) rgba(255,255,255,.45),0 calc(var(--k)*7) calc(var(--k)*20) rgba(0,0,0,.5)}
.fl .lgbadge{box-shadow:0 0 0 calc(var(--k)*2.5) rgba(255,255,255,.4),0 calc(var(--k)*5) calc(var(--k)*14) rgba(0,0,0,.45)}
.lgi{display:block;width:100%;height:100%;overflow:visible;object-fit:contain;pointer-events:none;-webkit-user-select:none;user-select:none}
.abbr{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:#e8ecf4;color:#0a0e1a;font:900 calc(var(--k)*34)/1 var(--disp)}

.wm{top:54.545%;font:900 calc(var(--k)*44)/1 var(--disp);letter-spacing:.08em;white-space:nowrap;text-transform:uppercase;writing-mode:vertical-rl;
  text-shadow:0 calc(var(--k)*2) calc(var(--k)*10) rgba(0,0,0,.55);color:#fff;opacity:.95}
.wm.a{left:2.83%;transform:translate(-50%,-50%) rotate(180deg)}
.wm.h{left:97.17%;transform:translate(-50%,-50%)}

/* corner clusters on the top apron */
.tl,.tr{top:calc(var(--k)*12);display:flex;flex-direction:column;gap:calc(var(--k)*8);z-index:4}
.tl{left:calc(var(--k)*64);align-items:flex-start}
.tr{right:calc(var(--k)*64);align-items:flex-end}
.lg{font:900 calc(var(--k)*22)/1 var(--disp);color:#0a0e1a;background:var(--white);padding:calc(var(--k)*6) calc(var(--k)*14) calc(var(--k)*6) calc(var(--k)*10);
  clip-path:polygon(0 0,100% 0,calc(100% - var(--k)*8) 100%,0 100%)}
.live{display:inline-flex;align-items:center;gap:calc(var(--k)*6);background:var(--live);color:#fff;font:900 calc(var(--k)*18)/1 var(--disp);padding:calc(var(--k)*5) calc(var(--k)*10)}
.live i{width:calc(var(--k)*9);height:calc(var(--k)*9);border-radius:50%;background:#fff;animation:blink 1.4s ease-in-out infinite}
.tag{font:900 calc(var(--k)*17)/1 var(--disp);letter-spacing:.06em;padding:calc(var(--k)*5) calc(var(--k)*10);background:var(--gold);color:#1a1200}
.tag.off{background:#fff;color:#7a0010}
.clk{font:800 calc(var(--k)*17)/1 var(--disp);white-space:nowrap;text-shadow:0 1px 6px rgba(0,0,0,.6)}

/* ---- centre-hung board ---- */
.board{left:50%;top:0;transform:translateX(-50%);width:70%;height:21.2%;z-index:4;display:grid;grid-template-columns:minmax(0,1fr) calc(var(--k)*172) minmax(0,1fr);
  filter:drop-shadow(0 calc(var(--k)*9) calc(var(--k)*18) rgba(0,0,0,.6))}
.bk{position:relative;display:flex;align-items:center;justify-content:space-between;gap:calc(var(--k)*10);min-width:0;overflow:hidden;
  padding:0 calc(var(--k)*24);text-shadow:0 2px 12px rgba(0,0,0,.45)}
.bk.a{background:linear-gradient(165deg,var(--ca-hi),var(--ca) 45%,var(--ca-lo));clip-path:polygon(0 0,100% 0,100% 100%,calc(var(--k)*24) 100%,0 calc(100% - var(--k)*24))}
.bk.h{background:linear-gradient(195deg,var(--cb-hi),var(--cb) 45%,var(--cb-lo));clip-path:polygon(0 0,100% 0,100% calc(100% - var(--k)*24),calc(100% - var(--k)*24) 100%,0 100%)}
.bk::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:radial-gradient(120% 70% at 50% -10%,rgba(255,255,255,.22),transparent 62%);pointer-events:none}
.tx{display:flex;flex-direction:column;min-width:0;max-width:100%}
.bk.h .tx{align-items:flex-end;text-align:right}
.city{font:700 calc(var(--k)*17)/1 var(--disp);opacity:.92;white-space:nowrap}
.nick{font:900 calc(var(--k)*37)/.95 var(--disp);text-transform:uppercase;white-space:nowrap;max-width:100%}
.rec{font:700 calc(var(--k)*17)/1.1 var(--text);opacity:.92;margin-top:calc(var(--k)*3)}
.score{position:relative;flex:none;font:900 calc(var(--k)*124)/.8 var(--disp);font-variant-numeric:tabular-nums;padding-top:calc(var(--k)*6);transform-origin:50% 60%}
.score.s3{font-size:calc(var(--k)*98)}
.score.pre{font-size:calc(var(--k)*70)}
.score.tick{animation:tick .45s ease-out}
.score.bump{animation:bump .75s cubic-bezier(.2,.9,.3,1.3)}
.bk.pop .score{animation:pop 1.1s steps(2,jump-none) 4}
.bk.lose{filter:saturate(.45) brightness(.72)}
.bk.win::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;box-shadow:inset 0 calc(var(--k)*-6) 0 var(--gold);z-index:1;pointer-events:none}
.plate{background:linear-gradient(180deg,#0b1122,#05080f);text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;
  border-top:calc(var(--k)*5) solid var(--white);padding:calc(var(--k)*6) calc(var(--k)*10) calc(var(--k)*8)}
.per{font:800 calc(var(--k)*21)/1 var(--disp);color:var(--mute);text-transform:uppercase;min-height:calc(var(--k)*21);white-space:nowrap}
.time{font:900 calc(var(--k)*70)/.95 var(--disp);font-variant-numeric:tabular-nums;white-space:nowrap}
.time.sm{font-size:calc(var(--k)*46)}
.plate.lv .time{color:#fff}
.ctx{margin-top:calc(var(--k)*6);font:800 calc(var(--k)*17)/1.1 var(--disp);min-height:calc(var(--k)*17);letter-spacing:.04em;color:var(--mute)}
.ctx.hot{color:var(--gold);animation:blink 1s ease-in-out infinite}

/* ---- line score under the centre logo ---- */
.lsp{left:50%;top:68.5%;transform:translateX(-50%);width:calc(var(--k)*430);background:var(--plate);backdrop-filter:blur(calc(var(--k)*5));
  padding:calc(var(--k)*8) calc(var(--k)*18) calc(var(--k)*10);z-index:4;
  clip-path:polygon(0 0,100% 0,100% calc(100% - var(--k)*12),calc(100% - var(--k)*12) 100%,calc(var(--k)*12) 100%,0 calc(100% - var(--k)*12))}
table.ls{width:100%;border-collapse:collapse;font:700 calc(var(--k)*23)/1.1 var(--text);font-variant-numeric:tabular-nums}
table.ls th{color:var(--mute);font-weight:600;padding:calc(var(--k)*3) calc(var(--k)*7);text-align:center}
table.ls td{padding:calc(var(--k)*4) calc(var(--k)*7);text-align:center;border-top:1px solid var(--hair)}
table.ls td:first-child,table.ls th:first-child{text-align:left;padding-left:0}
table.ls td:first-child{font:900 calc(var(--k)*26)/1 var(--disp)}
table.ls td:first-child i{display:inline-block;width:calc(var(--k)*8);height:calc(var(--k)*22);margin-right:calc(var(--k)*9);vertical-align:middle;background:var(--tc)}
table.ls .tot{font-weight:800;color:#fff}
table.ls .cur{color:var(--gold)}
table.ls .dim{color:var(--mute)}
table.ls.wide{font-size:calc(var(--k)*19)}
table.ls.wide th,table.ls.wide td{padding-left:calc(var(--k)*4);padding-right:calc(var(--k)*4)}
.lsp.empty{display:none}

/* ---- ribbon on the bottom apron: venue, latest play, broadcast ---- */
.ribbon{left:5.66%;width:88.7%;top:92.4%;height:7.6%;z-index:4;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:calc(var(--k)*24);
  padding:0 calc(var(--k)*8);font:700 calc(var(--k)*21)/1.1 var(--text)}
.ribbon .v,.ribbon .m{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(var(--k)*300)}
.ribbon .m{text-align:right}
.ribbon .p{display:flex;align-items:center;justify-content:center;gap:calc(var(--k)*12);min-width:0;overflow:hidden}
.ribbon .p b{font:900 calc(var(--k)*21)/1 var(--disp);padding:calc(var(--k)*4) calc(var(--k)*10);background:var(--tc,var(--hair));color:#fff;flex:none}
.ribbon .p span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ribbon .p.in{animation:slidein .4s ease-out}
.ribbon .note{color:var(--gold)}

/* ---- stats drawer: slides up over the lower half of the court ---- */
.drawer{position:absolute;left:0;right:0;bottom:0;height:calc(var(--k)*232);z-index:5;display:grid;grid-template-rows:auto minmax(0,1fr);
  background:var(--plate);backdrop-filter:blur(calc(var(--k)*6));transition:transform .4s cubic-bezier(.3,.8,.3,1),opacity .3s ease;
  clip-path:polygon(0 calc(var(--k)*16),calc(var(--k)*16) 0,calc(100% - var(--k)*16) 0,100% calc(var(--k)*16),100% 100%,0 100%)}
.drawer.off,.drawer.tuck{transform:translateY(104%);opacity:0;pointer-events:none}
.slabhead{position:relative;display:flex;align-items:center;gap:calc(var(--k)*20);padding:calc(var(--k)*14) calc(var(--k)*34) calc(var(--k)*8);border-bottom:1px solid var(--hair)}
.vt{font:900 calc(var(--k)*30)/1 var(--disp);text-transform:uppercase}
.vd{display:flex;gap:calc(var(--k)*5)}
.vd i{width:calc(var(--k)*11);height:calc(var(--k)*6);background:rgba(255,255,255,.28)}
.vd i.on{width:calc(var(--k)*30);background:var(--gold)}
.slabbody{padding:calc(var(--k)*8) calc(var(--k)*34) calc(var(--k)*16);min-height:0;overflow:hidden;transition:opacity .25s ease}
.slabbody.out{opacity:0}
.cycle{position:fixed;left:0;right:0;top:0;height:calc(var(--u)*.4);z-index:25;pointer-events:none;overflow:hidden}
.cycle i{display:block;height:100%;background:var(--gold);transform-origin:left;transform:scaleX(0)}
.cycle i.run{animation:fill linear forwards}

.cmp{display:flex;flex-direction:column;gap:calc(var(--k)*2)}
.cr{display:grid;grid-template-columns:calc(var(--k)*88) minmax(0,1fr) calc(var(--k)*170) minmax(0,1fr) calc(var(--k)*88);align-items:center;gap:calc(var(--k)*10);min-height:calc(var(--k)*25)}
.cr .v{font:900 calc(var(--k)*25)/1 var(--disp);font-variant-numeric:tabular-nums}
.cr .v.a{text-align:right}
.cr .k{text-align:center;color:var(--mute);font:600 calc(var(--k)*21)/1 var(--text)}
.cr .bar{height:calc(var(--k)*12);background:rgba(255,255,255,.1);display:flex}
.cr .bar.l{justify-content:flex-end}
.cr .bar i{display:block;height:100%}
.cr .bar.l i{background:var(--ca-hi)}
.cr .bar.r i{background:var(--cb-hi)}
.cr.hd .t{font:900 calc(var(--k)*28)/1 var(--disp);display:flex;align-items:center;gap:calc(var(--k)*8)}
.cr.hd .t.a{justify-content:flex-end;grid-column:1/3}
.cr.hd .t.h{grid-column:4/6}
.cr.hd .t i{display:inline-block;width:calc(var(--k)*7);height:calc(var(--k)*22)}
.lr{display:grid;grid-template-columns:minmax(0,1fr) calc(var(--k)*110) minmax(0,1fr);gap:calc(var(--k)*14);align-items:center;min-height:calc(var(--k)*34);font:600 calc(var(--k)*23)/1.1 var(--text);border-top:1px solid rgba(255,255,255,.1)}
.lr.hd{border-top:0;font:900 calc(var(--k)*28)/1 var(--disp);min-height:calc(var(--k)*26)}
.lr .a{text-align:right}.lr .h{text-align:left}
.lr b{font:900 calc(var(--k)*31)/1 var(--disp);margin-right:calc(var(--k)*4)}
.lr .k{text-align:center;color:var(--mute);font:700 calc(var(--k)*20)/1 var(--text)}
.pl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:calc(var(--k)*30)}
.tb{min-width:0}
.tb table{width:100%;border-collapse:collapse;font:600 calc(var(--k)*20)/1.05 var(--text);font-variant-numeric:tabular-nums}
.tb th{color:var(--mute);font-weight:600;text-align:right;padding:calc(var(--k)*2) calc(var(--k)*6)}
.tb td{text-align:right;padding:calc(var(--k)*2) calc(var(--k)*6);border-top:1px solid rgba(255,255,255,.1);white-space:nowrap}
.tb th:first-child,.tb td:first-child{text-align:left;padding-left:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(var(--k)*210)}
.tb td:first-child{font-weight:700}
.tb td .p{color:var(--mute);font-weight:500;margin-left:calc(var(--k)*5);font-size:.85em}
.tb tr.g th{font:900 calc(var(--k)*21)/1 var(--disp);color:var(--white);padding-top:calc(var(--k)*4)}
.tb tr.tm th{font:900 calc(var(--k)*27)/1 var(--disp);color:var(--white);border-bottom:calc(var(--k)*3) solid var(--tc);padding:calc(var(--k)*1) 0 calc(var(--k)*4);text-align:left}
.tb td.hot{color:#fff;font-weight:800}
.plays{display:flex;flex-direction:column;gap:calc(var(--k)*4)}
.pr{display:grid;grid-template-columns:calc(var(--k)*100) calc(var(--k)*64) minmax(0,1fr) calc(var(--k)*110);align-items:center;gap:calc(var(--k)*14);font:600 calc(var(--k)*22)/1.1 var(--text);min-height:calc(var(--k)*30)}
.pr .w{color:var(--mute)}
.pr .tm{font:900 calc(var(--k)*23)/1 var(--disp);padding:calc(var(--k)*3) 0;text-align:center;background:var(--tc)}
.pr .x{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .sc{font:900 calc(var(--k)*27)/1 var(--disp);text-align:right;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(var(--k)*250),1fr));gap:calc(var(--k)*16)}
.tile{background:rgba(255,255,255,.07);padding:calc(var(--k)*12) calc(var(--k)*16);border-left:calc(var(--k)*4) solid var(--gold);min-width:0}
.tile .k{font:600 calc(var(--k)*19)/1.1 var(--text);color:var(--mute)}
.tile .v{font:900 calc(var(--k)*40)/1.05 var(--disp);margin-top:calc(var(--k)*3);overflow:hidden;text-overflow:ellipsis}
.tile .v.sm{font-size:calc(var(--k)*28)}
.empty{font:800 calc(var(--k)*34)/1 var(--disp);color:var(--mute);padding-top:calc(var(--k)*40);text-align:center}

/* ---- effects ---- */
.fxh{position:absolute;top:0;right:0;bottom:0;left:0;z-index:8;pointer-events:none;overflow:hidden}
.fly{position:absolute;left:0;top:0;font:900 calc(var(--k)*76)/1 var(--disp);color:var(--gold);text-shadow:0 calc(var(--k)*3) calc(var(--k)*14) rgba(0,0,0,.8),0 0 calc(var(--k)*22) rgba(255,198,26,.7);will-change:transform,opacity;white-space:nowrap}
.pt{position:absolute;left:0;top:0;font:900 calc(var(--k)*21)/1 var(--disp);letter-spacing:.05em;color:#fff;background:var(--tc,#000);padding:calc(var(--k)*5) calc(var(--k)*11);white-space:nowrap;
  box-shadow:0 calc(var(--k)*4) calc(var(--k)*12) rgba(0,0,0,.5);will-change:transform,opacity}
.pt small{font:700 calc(var(--k)*16)/1 var(--text);opacity:.9;margin-left:calc(var(--k)*8)}
.callout{position:absolute;left:0;top:0;font:900 calc(var(--k)*50)/1 var(--disp);font-style:italic;color:#fff;letter-spacing:.04em;white-space:nowrap;will-change:transform,opacity;
  text-shadow:0 0 calc(var(--k)*18) var(--tc,var(--gold)),0 calc(var(--k)*4) calc(var(--k)*10) rgba(0,0,0,.85)}
.bnz{position:absolute;left:50%;top:24%;width:0;height:0;z-index:2}
.bn{position:absolute;left:0;top:0;transform:translate(-50%,0) skewX(-8deg);min-width:calc(var(--k)*470);text-align:center;color:#fff;padding:calc(var(--k)*12) calc(var(--k)*54) calc(var(--k)*14);
  background:linear-gradient(100deg,var(--bn1,#333),var(--bn2,#111));border-top:calc(var(--k)*6) solid var(--white);box-shadow:0 calc(var(--k)*12) calc(var(--k)*30) rgba(0,0,0,.6);white-space:nowrap}
.bn b{display:block;font:900 calc(var(--k)*72)/.95 var(--disp);letter-spacing:.02em;text-shadow:0 calc(var(--k)*3) calc(var(--k)*10) rgba(0,0,0,.45)}
.bn span{display:block;margin-top:calc(var(--k)*5);font:800 calc(var(--k)*23)/1 var(--disp);letter-spacing:.12em;opacity:.95;text-transform:uppercase}
.bn.gold{--bn1:#ffc61a;--bn2:#e08a00;color:#1a1200}
.bn.gold b{text-shadow:none}
.bn.dark{--bn1:#171d33;--bn2:#080b16}
.bn.red{--bn1:#ff2d3d;--bn2:#8a0010}
.cf{position:absolute;top:0;left:0;will-change:transform,opacity}

/* ---- other games ---- */
.strip{display:flex;align-items:stretch;gap:calc(var(--u)*1);height:calc(var(--u)*6.6);min-width:0}
.chips{display:flex;gap:calc(var(--u)*1);flex:1;min-width:0;overflow:hidden}
.chip{flex:0 0 calc(var(--u)*40);display:flex;align-items:center;gap:calc(var(--u)*1.1);padding:0 calc(var(--u)*1.6);border:0;color:var(--white);cursor:pointer;
  background:var(--plate2);font:900 calc(var(--u)*3)/1 var(--disp);white-space:nowrap;text-align:left;
  clip-path:polygon(0 0,100% 0,100% calc(100% - var(--u)*1.2),calc(100% - var(--u)*1.2) 100%,0 100%)}
.chip.on{background:rgba(255,255,255,.26)}
.chip:focus-visible{outline:calc(var(--u)*.35) solid var(--gold);outline-offset:calc(var(--u)*-.35)}
.chip i{width:calc(var(--u)*.6);height:calc(var(--u)*3.2);flex:none}
.chip .n{font-variant-numeric:tabular-nums}
.chip .s{margin-left:auto;font:600 calc(var(--u)*2.2)/1 var(--text);color:var(--mute)}
.chip .s.lv{color:#fff}
.chip .s.lv::before{content:"";display:inline-block;width:calc(var(--u)*.9);height:calc(var(--u)*.9);border-radius:50%;background:var(--live);margin-right:calc(var(--u)*.6)}
.cb{flex:none;box-sizing:border-box;width:calc(var(--u)*4.9);height:calc(var(--u)*4.9);padding:calc(var(--u)*.6);border-radius:50%;background:radial-gradient(circle at 50% 28%,#fff,#e8ecf4)}
.count{align-self:center;color:var(--mute);font:600 calc(var(--u)*2.2)/1 var(--text);padding-left:calc(var(--u)*1);white-space:nowrap}
.count.pin{color:var(--gold)}
.track{display:flex;gap:calc(var(--u)*1);flex:none;will-change:transform}
.chips.scroll{overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip.hot{background:var(--gold);color:#1a1200}
.chip.hot .s,.chip.hot .s.lv{color:#1a1200}

.wipe{position:fixed;top:0;left:-130vw;width:130vw;height:100%;z-index:20;pointer-events:none;display:none;
  background:linear-gradient(to right,var(--board) 0 97%,#fff 97% 100%);transform:skewX(-14deg)}
.wipe.go{display:block;animation:sweep .7s cubic-bezier(.6,0,.4,1) both}
#dim{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;background:#000;opacity:0;z-index:30}

/* ---- controls (appear on mouse move) ---- */
#hud{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;flex-direction:column;gap:8px;box-sizing:border-box;max-width:calc(100vw - 32px);padding:10px 12px;
  background:rgba(5,8,18,.94);border:1px solid #2a3350;font:600 13px/1 var(--text);
  opacity:0;pointer-events:none;transform:translate(-50%,24px);transition:opacity .25s ease,transform .25s ease}
body.ui #hud{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
#hud .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
#hud button,#hud select{color:var(--white);background:#10162a;border:1px solid #2a3350;padding:8px 12px;cursor:pointer;font-weight:700;letter-spacing:.03em}
#hud button[aria-pressed="true"]{background:var(--white);border-color:var(--white);color:#0a0e1a}
#hud label{display:flex;gap:6px;align-items:center;color:var(--mute)}
#hud input[type=range]{width:90px;accent-color:#ffc61a}
#hud :focus-visible{outline:2px solid #ffc61a;outline-offset:2px}
#hud .msg{text-align:center;color:#ffc61a;font-weight:700}
@media (max-height:520px){
  #hud{bottom:8px;padding:6px 8px;gap:4px}
  #hud button,#hud select{padding:5px 8px;font-size:12px}
  #hud .row{gap:4px}
  #hud input[type=range]{width:70px}
}

@keyframes blink{50%{opacity:.25}}
@keyframes pop{50%{color:var(--gold)}}
@keyframes tick{0%{transform:translateY(-14%);opacity:.3}100%{transform:none;opacity:1}}
@keyframes bump{0%{transform:scale(1)}28%{transform:scale(1.34);color:var(--gold);text-shadow:0 0 calc(var(--k)*30) var(--gold)}100%{transform:scale(1)}}
@keyframes fill{to{transform:scaleX(1)}}
@keyframes sweep{to{transform:translateX(260vw) skewX(-14deg)}}
@keyframes clutch{0%,100%{opacity:0}50%{opacity:.85}}
@keyframes flashy{0%{opacity:.95}100%{opacity:0}}
@keyframes slidein{from{opacity:0;transform:translateY(60%)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{opacity:.35}}
.ringlive{transform-box:fill-box;transform-origin:center;animation:spin 28s linear infinite}
.ringglow{animation:breathe 3.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.live i,.bk.pop .score,.ringlive,.ringglow,.arena.clutch::after{animation:none}.wipe{display:none!important}.slabbody,.drawer,#hud{transition:none}}

/* ---- phones and tall screens: the court fits the width and the stats sit underneath ---- */
@media (max-aspect-ratio:9/10){
  :root{--u:calc(100vw / 54)}
  body{overflow-y:auto;overflow-x:hidden}
  .stage{height:auto;min-height:100%;grid-template-rows:auto auto;padding-block:calc(var(--u)*1)}
  .cell{display:block}
  .wrap{margin:0 auto}
  .drawer{position:relative;left:auto;right:auto;bottom:auto;height:auto;min-height:calc(var(--u)*30);margin-top:calc(var(--u)*1);clip-path:none;transition:none}
  .drawer.off{display:none}
  .drawer.tuck{transform:none;opacity:1;pointer-events:auto}
  .drawer .slabhead,.drawer .slabbody{padding-left:calc(var(--u)*2);padding-right:calc(var(--u)*2)}
  .vt{font-size:calc(var(--u)*3.6)}
  .cr{grid-template-columns:calc(var(--u)*7) minmax(0,1fr) calc(var(--u)*14) minmax(0,1fr) calc(var(--u)*7);gap:calc(var(--u)*.8);min-height:calc(var(--u)*3)}
  .cr .v{font-size:calc(var(--u)*3)}.cr .k{font-size:calc(var(--u)*2.3)}
  .cr.hd .t{font-size:calc(var(--u)*3.4)}.cr.hd .t i{width:calc(var(--u)*.8);height:calc(var(--u)*2.6)}
  .cr .bar{height:calc(var(--u)*1.4)}
  .lr{grid-template-columns:minmax(0,1fr) calc(var(--u)*9) minmax(0,1fr);font-size:calc(var(--u)*2.7);min-height:calc(var(--u)*4)}
  .lr b{font-size:calc(var(--u)*3.4)}.lr .k{font-size:calc(var(--u)*2.3)}.lr.hd{font-size:calc(var(--u)*3.4)}
  .pl{grid-template-columns:1fr;gap:calc(var(--u)*2)}
  .tb{overflow-x:auto}
  .tb table{font-size:calc(var(--u)*2.1)}.tb tr.tm th{font-size:calc(var(--u)*3)}.tb tr.g th{font-size:calc(var(--u)*2.1)}
  .tb th,.tb td{padding-left:calc(var(--u)*.55);padding-right:calc(var(--u)*.55)}
  .tb th:nth-child(n+7),.tb td:nth-child(n+7){display:none}
  .tb th:first-child,.tb td:first-child{max-width:calc(var(--u)*19);padding-left:0}
  .pr{grid-template-columns:calc(var(--u)*10) calc(var(--u)*6.5) minmax(0,1fr) calc(var(--u)*9);font-size:calc(var(--u)*2.6);gap:calc(var(--u)*1);min-height:calc(var(--u)*3.4)}
  .pr .tm{font-size:calc(var(--u)*2.6)}.pr .sc{font-size:calc(var(--u)*3.1)}
  .tiles{grid-template-columns:1fr;gap:calc(var(--u)*1.2)}
  .tile .k{font-size:calc(var(--u)*2.4)}.tile .v{font-size:calc(var(--u)*4.4)}.tile .v.sm{font-size:calc(var(--u)*3.2)}
  .empty{font-size:calc(var(--u)*4);padding-top:calc(var(--u)*4)}
  .chip{flex-basis:calc(var(--u)*36)}
  #bFs{display:none}
}

/* ticker scroll: driven here rather than by a CSS animation so it keeps its place when the strip redraws on each score update */
function tickLoop(t){
  requestAnimationFrame(tickLoop);
  if(!tick.on||!tick.el||tick.hover||paused||document.hidden){ tick.last=t; return; }
  var dt=Math.min(100,t-(tick.last||t)); tick.last=t;
  tick.x+=tick.v*dt/1000; if(tick.w>0&&tick.x>=tick.w) tick.x%=tick.w;
  tick.el.style.transform='translate3d('+(-tick.x).toFixed(1)+'px,0,0)';
}

/* =========================================================
   Action animations
   Plays arrive from ESPN's play-by-play (or from the demo simulator), become events in a queue, and play one at a time on the court.
   If a game has no usable play-by-play, a score change on the scoreboard feed plays a generic basket instead.
   ========================================================= */
var FX={q:[],busyUntil:0,st:{},hasPbp:{},last:{},prevSt:{},gapSince:{},tuckT:null};

/* ---- reading plays ---- */
function classify(p){
  var l=p.low;
  if(/timeout/.test(l)) return 'timeout';
  if(/end (of )?(the )?(period|quarter|game|half)|start (of )?(the )?(period|quarter|game)|jump ?ball|substitution|enters the game/.test(l)&&!p.scoring) return '';
  if(/free throw/.test(l)) return (p.scoring&&p.val>0)||/\bmakes\b/.test(l)?'ftmake':'ftmiss';
  if(p.scoring&&p.val>0) return 'make';
  if(/\bblocks?\b/.test(l)) return 'block';
  if(/\bsteals?\b/.test(l)) return 'steal';
  if(/foul/.test(l)&&!/turnover/.test(l)) return 'foul';
  if(/turnover|bad pass|lost ball|traveling|out of bounds|discontinue|3 second|offensive goaltending|shot clock|backcourt/.test(l)) return 'tov';
  if(/offensive rebound/.test(l)) return 'oreb';
  if(/rebound/.test(l)) return 'reb';
  if(/\bmisses\b|\bmissed\b/.test(l)||(p.shooting&&!p.scoring)) return 'miss';
  return '';
}
function whoOf(p){
  var m=/^(.+?)\s+(makes|misses|blocks|shooting|personal|offensive|defensive|loose|bad|lost|traveling|steals|turnover|draws|technical|flagrant|enters|jumpball|out of)\b/i.exec(p.tx);
  var n=m?m[1]:''; if(!n||n.split(' ').length>4||/timeout/i.test(n)) return '';
  var parts=n.split(' '); return (parts.length>1?parts[0].charAt(0)+'. '+parts.slice(1).join(' '):n).toUpperCase();
}
function stealerOf(p){ var m=/\(([^)]+?) steals\)/i.exec(p.tx); if(!m) return ''; var parts=m[1].split(' '); return (parts.length>1?parts[0].charAt(0)+'. '+parts.slice(1).join(' '):m[1]).toUpperCase(); }
function textDist(p){ var m=/(\d+)-foot/.exec(p.low); return m?+m[1]:null; }
/* a shot's spot on the court, folded onto the scoring team's own basket: away scores at the left basket, home at the right one */
function clampHalf(side,x){ return side==='h'?clamp(x,474,936):clamp(x,4,466); }
function shotPos(p,side,dunk,three,ft){
  var dir=side==='h'?-1:1, b=BASKET[side], td=textDist(p);
  if(ft) return {x:side==='h'?750:190,y:250};
  if(p.cx!=null&&p.cy!=null){
    var d=p.cy>47?94-p.cy:p.cy, x=side==='h'?940-d*10:d*10, y=clamp(p.cx*10,5,495);
    var ftDist=Math.hypot(x-b.x,y-b.y)/10;
    if(td==null||Math.abs(ftDist-td)<=10) return {x:x,y:y};
  }
  var dist=td!=null?td:(dunk?2:three?24.5:(/layup|tip|hook|finger/.test(p.low)?4:15));
  var ang=rnd(-1,1)*(three?1.2:(dist<6?1.1:1.0)), r=dist*10;
  return {x:clampHalf(side,b.x+dir*r*Math.cos(ang)),y:clamp(250+r*Math.sin(ang),14,486)};
}
function shotDesc(p,ev){
  if(ev.ft) return 'FREE THROW';
  var td=textDist(p);
  if(ev.dunk) return 'DUNK';
  if(ev.three) return '3-PT'+(td?' · '+td+' FT':'');
  if(/layup|tip|hook|finger/.test(p.low)) return 'LAYUP';
  return (td?td+'-FT ':'')+'JUMPER';
}
function fullName(g,side){ var t=side==='h'?g.home:g.away; return ((t.city?t.city+' ':'')+t.nick).toUpperCase(); }
function evPush(ev,delay){ ev.at=Date.now()+(delay||0); FX.q.push(ev); }

function ingestPlays(g,pbp){
  if(!g||!pbp||!pbp.length) return;
  var st=FX.st[g.id]||(FX.st[g.id]={seen:{},first:true,run:{side:'',pts:0,fired:0},lead:0,aw:0,hw:0});
  var now=Date.now(), fresh=[];
  pbp.forEach(function(p){ if(!st.seen[p.id]){ st.seen[p.id]=1; fresh.push(p); } });
  if(!fresh.length) return;
  var show=games[cur]&&games[cur].id===g.id, baseline=st.first, dl=delayMs();
  st.first=false;
  fresh.forEach(function(p){
    var silent=baseline&&!(p.wall&&now-p.wall<=30000);
    var evs=[]; try{ evs=playEvents(g,p,st,silent); }catch(e){ evs=[]; }
    if(show) evs.forEach(function(e){ e.gid=g.id; evPush(e,dl); });
  });
}
function playEvents(g,p,st,silent){
  var k=classify(p), sd=p.side, evs=[], rib=null, who=whoOf(p);
  function ribbon(){ return {abbr:sd==='h'?g.home.abbr:sd==='a'?g.away.abbr:'',side:sd,when:(p.per?periodShort(p.per)+' ':'')+p.clock,text:p.tx}; }
  if(k==='make'||k==='ftmake'){
    var aw=p.aw!=null?p.aw:st.aw, hw=p.hw!=null?p.hw:st.hw;
    if(!sd){ if(aw>st.aw) sd='a'; else if(hw>st.hw) sd='h'; }
    var pts=p.val||(sd==='a'?aw-st.aw:sd==='h'?hw-st.hw:0)||(k==='ftmake'?1:2);
    st.aw=aw; st.hw=hw;
    if(!sd) return [];
    rib=ribbon(); FX.last[g.id]=rib;
    /* runs and lead changes */
    if(st.run.side!==sd) st.run={side:sd,pts:0,fired:0};
    st.run.pts+=pts;
    var thr=[8,10,12,15,18,22,26], hit=0; thr.forEach(function(t){ if(st.run.pts>=t&&st.run.fired<t) hit=t; });
    var diff=aw-hw, sign=diff>0?1:diff<0?-1:0, prev=st.lead; st.lead=sign;
    var banners=[];
    if(hit){ st.run.fired=hit; banners.push({k:'banner',kind:'team',side:sd,title:st.run.pts+'-0 RUN',sub:fullName(g,sd)}); }
    else if(prev!==0&&sign!==0&&sign!==prev&&p.per) banners.push({k:'banner',kind:'team',side:sign>0?'a':'h',title:'LEAD CHANGE',sub:(sign>0?g.away.nick:g.home.nick).toUpperCase()+' TAKE THE LEAD'});
    else if(prev!==0&&sign===0) banners.push({k:'banner',kind:'gold',side:'',title:'TIE GAME',sub:aw+' – '+hw});
    if(silent) return [];
    var ft=k==='ftmake', dunk=/dunk/.test(p.low), three=!ft&&(pts===3||/three point|3-pt|three-point/.test(p.low));
    var ev={k:'make',side:sd,pts:pts,ft:ft,dunk:dunk,three:three,rib:rib};
    ev.pos=shotPos(p,sd,dunk,three,ft); ev.who=who; ev.desc=shotDesc(p,ev); ev.hold=3000;
    evs.push(ev); return evs.concat(banners);
  }
  if(p.aw!=null) st.aw=p.aw; if(p.hw!=null) st.hw=p.hw;
  if(silent||!sd&&k!=='timeout') return [];
  if(k==='ftmiss'){ var fe={k:'miss',side:sd,ft:true,pos:shotPos(p,sd,false,false,true),who:who,desc:'FREE THROW',rib:ribbon()}; return [fe]; }
  if(k==='miss'){
    var dk=/dunk/.test(p.low), th=/three point|3-pt|three-point/.test(p.low);
    var me={k:'miss',side:sd,pos:shotPos(p,sd,dk,th,false),who:who,desc:shotDesc(p,{dunk:dk,three:th}),rib:ribbon()}; return [me];
  }
  if(k==='block'){
    var shooter=sd==='a'?'h':'a', dk2=/dunk/.test(p.low), th2=/three point|3-pt|three-point/.test(p.low);
    return [{k:'block',side:sd,shooter:shooter,pos:shotPos(p,shooter,dk2,th2,false),who:who,rib:ribbon()}];
  }
  if(k==='steal'){ var ss=sd==='a'?'h':'a'; return [{k:'tag',kind:'steal',side:ss,who:stealerOf(p)||'',text:'STEAL',rib:ribbon()}]; }
  if(k==='tov') return [{k:'tag',kind:'tov',side:sd,who:who,text:'TURNOVER',rib:ribbon(),low:1}];
  if(k==='oreb') return [{k:'tag',kind:'reb',side:sd,who:'',text:'OFF. REBOUND',rib:ribbon(),low:1}];
  if(k==='foul') return [{k:'foul',side:sd,who:who,rib:ribbon()}];
  if(k==='timeout'){
    var tt=sd?fullName(g,sd):'TV TIMEOUT';
    return [{k:'timeout',side:sd,title:sd?'TIMEOUT':'TV TIMEOUT',sub:sd?tt:'',rib:ribbon()}];
  }
  return [];
}

/* a score change with no play to explain it still gets a basket on the court */
function randPos(side,pts){
  var dir=side==='h'?-1:1, b=BASKET[side];
  if(pts===1) return {x:side==='h'?750:190,y:250};
  var dist=pts===3?rnd(23.8,26.5):rnd(2,17), ang=rnd(-1,1)*(pts===3?1.15:1.05);
  return {x:clampHalf(side,b.x+dir*dist*10*Math.cos(ang)),y:clamp(250+dist*10*Math.sin(ang),14,486)};
}
function synthMakes(g,side,delta){
  var parts=[]; while(delta>0){ var pt=delta>=3&&Math.random()<.5?3:(delta>=2?2:1); if(delta===3) pt=3; parts.push(pt); delta-=pt; }
  parts.forEach(function(pt){
    var dunk=pt===2&&Math.random()<.14, pos=dunk?randPos(side,2):randPos(side,pt); if(dunk) pos={x:side==='h'?887.5-rnd(25,45):52.5+rnd(25,45),y:250+rnd(-30,30)};
    var ev={k:'make',gid:g.id,side:side,pts:pt,ft:pt===1,dunk:dunk,three:pt===3,pos:pos,who:'',desc:pt===1?'FREE THROW':dunk?'DUNK':pt===3?'3-PT':'BASKET',hold:3000};
    evPush(ev,delayMs()?0:0);
  });
}
function diffFx(g,side,delta){
  if(SIM&&SIM.g===g) return;
  if(!games[cur]||games[cur].id!==g.id) return;
  if(FX.hasPbp[g.id]) return;
  synthMakes(g,side,delta);
}
function poolAdd(g,side,delta){ diffFx(g,side,delta); }
/* when a game has plays but a basket never shows up in them, play a generic one after a grace period */
function poolCheck(){
  var g=games[cur]; if(!g||g.state!=='in'||!FX.hasPbp[g.id]||(SIM&&SIM.g===g)) return;
  var st=FX.st[g.id]; if(!st||st.first) return;
  ['a','h'].forEach(function(s){
    var feed=(s==='a'?g.away.score:g.home.score)||0, seen=s==='a'?st.aw:st.hw, key=g.id+s, now=Date.now();
    if(feed>seen){
      if(!FX.gapSince[key]) FX.gapSince[key]=now;
      else if(now-FX.gapSince[key]>20000){ synthMakes(g,s,feed-seen); if(s==='a') st.aw=feed; else st.hw=feed; FX.gapSince[key]=0; }
    } else FX.gapSince[key]=0;
  });
}

/* ---- status changes: end of period, halftime, overtime, final ---- */
function snap(g){ return {state:g.state,big:g.st.big,per:g.st.period||0}; }
function statusFx(g){
  var pv=FX.prevSt[g.id]; FX.prevSt[g.id]=snap(g);
  if(!pv||!games[cur]||games[cur].id!==g.id) return;
  var sc=g.away.score+' – '+g.home.score;
  if(g.state==='in'&&g.st.big==='HALF'&&pv.big!=='HALF') evPush({k:'banner',gid:g.id,kind:'dark',title:'HALFTIME',sub:sc});
  else if(g.state==='in'&&g.st.big==='END'&&pv.big!=='END'){
    var p=g.st.period||0; evPush({k:'banner',gid:g.id,kind:'dark',title:p>=4&&g.away.score===g.home.score?'END OF REGULATION':'END OF '+periodWord(p).replace(' QUARTER',' QTR'),sub:sc});
  }
  else if(g.state==='in'&&(g.st.period||0)>4&&pv.per>0&&pv.per<(g.st.period||0)&&pv.per<=4) evPush({k:'banner',gid:g.id,kind:'red',title:periodWord(g.st.period),sub:'ALL SQUARE · '+sc});
  if(pv.state==='in'&&g.state==='post'&&g.away.score!=null) finalFx(g);
}
function finalFx(g){
  var a=g.away.score, h=g.home.score, ws=a>h?'a':h>a?'h':'', w=ws==='a'?g.away:g.home;
  evPush({k:'banner',gid:g.id,kind:'gold',title:'FINAL',sub:ws?w.nick.toUpperCase()+' WIN '+Math.max(a,h)+' – '+Math.min(a,h):'TIED '+a+' – '+h,confetti:ws});
}
function fxReset(g){
  FX.q=[]; FX.busyUntil=0; FX.prevSt[g.id]=snap(g);
  $('fxg').innerHTML=''; $('fxh').querySelectorAll('.pt,.fly,.callout,.cf').forEach(function(n){ n.parentNode.removeChild(n); }); $('bnz').innerHTML='';
  var a=$('arena'); a.classList.remove('tmo'); a.classList.remove('foul');
}

function shake(f){ A($('arena'),[{transform:'translate(0,0)'},{transform:'translate(-7px,3px)'},{transform:'translate(6px,-4px)'},{transform:'translate(-4px,3px)'},{transform:'translate(2px,-1px)'},{transform:'translate(0,0)'}],{duration:380*f}); }

  svgNode('circle',{r:11.5,fill:'#e8742a',stroke:'#2a1204','stroke-width':1.7},b);

/* ---- the queue ---- */
function prioOf(e){ return e.k==='make'||e.k==='banner'||e.k==='timeout'?3:e.k==='block'?2:(e.low||e.k==='miss'||e.k==='foul')?1:2; }

function playFx(ev,g,fast){
  var d=400;
  try{
    switch(ev.k){
      case 'make': d=fxMake(ev,g,fast); break;
      case 'miss': d=fxMiss(ev,g,fast); break;
      case 'block': d=fxBlock(ev,g,fast); break;
      case 'tag': d=fxTag(ev,g,fast); break;
      case 'foul': d=fxFoul(ev,g,fast); break;
      case 'timeout': d=fxTimeout(ev,g); break;
      case 'banner': d=fxBanner(ev,g); break;
    }
  }catch(e){ d=300; }
  return d;
}
function fxPump(){
  var now=Date.now(), g=games[cur]; if(!g||document.hidden) return;
  FX.q=FX.q.filter(function(e){ return e.gid===g.id&&now-e.at<25000; });
  if(now<FX.busyUntil||!FX.q.length) return;
  var ready=FX.q.filter(function(e){ return e.at<=now; }); if(!ready.length) return;
  if(ready.length>4){
    var keep=ready.filter(function(e,i){ return prioOf(e)>=2||i>=ready.length-2; });
    FX.q=FX.q.filter(function(e){ return e.at>now||keep.indexOf(e)>=0; }); ready=keep;
  }
  var ev=ready[0]; FX.q.splice(FX.q.indexOf(ev),1);
  var fast=ready.length>3, d=playFx(ev,g,fast);
  FX.busyUntil=now+d;
  if(ev.k!=='tag'||!ev.low) tuck(d+500);
  if(ev.hold||ev.k==='banner') holdUntil=Math.max(holdUntil,now+d+3000);
}

    case 'timeout': ev={k:'timeout',gid:g.id,side:'a',title:'TIMEOUT',sub:fullName(g,'a')}; break;
